[tool.black]
line-length = 100
target-version = ["py313"]
include = "\\.pyi?$"
exclude = '''
/(\.git|\.pytest_cache|__pycache__|\.venv|build|dist|python-dist|release)/
'''

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests", "backend/services"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [
  ".git",
  ".pytest_cache",
  "__pycache__",
  ".venv",
  "build",
  "dist",
  "python-dist",
  "release",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**/*.py" = ["S101"]
