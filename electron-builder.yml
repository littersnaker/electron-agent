appId: com.agent.workspace
productName: Multi-agent
copyright: Copyright © 2026 Multi-agent Team

electronDownload:
  mirror: https://registry.npmmirror.com/-/binary/electron/

directories:
  output: release
  buildResources: build

files:
  - ".electron/**/*"
  - "package.json"
  - "!**/*.map"

extraResources:
  - from: dist
    to: frontend
    filter:
      - "**/*"
  # 复制 PyInstaller onedir 的全部内容。安装后可执行文件位于
  # resources/backend/multi-agent-backend(.exe)，依赖位于同级 _internal。
  - from: python-dist/multi-agent-backend
    to: backend
    filter:
      - "**/*"
  - from: public/icon.ico
    to: icon.ico
  - from: public/icon.png
    to: icon.png

asar: true
compression: maximum
removePackageScripts: true

win:
  target:
    - target: nsis
      arch: [x64]
  icon: public/icon.ico
  artifactName: "Multi-agent-${version}-windows-${arch}-setup.${ext}"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "Multi-agent"
  uninstallDisplayName: "Multi-agent"
  installerIcon: public/icon.ico
  uninstallerIcon: public/icon.ico
  installerHeader: build/installerHeader.bmp
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/uninstallerSidebar.bmp
  deleteAppDataOnUninstall: false
  displayLanguageSelector: false
  installerLanguages: [zh_CN]
  language: 2052
  runAfterFinish: true
  include: build/installer.nsh

mac:
  target: [dmg]
  icon: public/icon.png
  artifactName: "Multi-agent-${version}-macos-${arch}.${ext}"
  category: public.app-category.productivity

linux:
  target: [deb, AppImage]
  icon: public/icon.png
  artifactName: "Multi-agent-${version}-linux-${arch}.${ext}"
  category: Utility
