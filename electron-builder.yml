# Agent Workspace Electron 打包配置
# 强制通过 package.json 脚本的 --config electron-builder.yml 读取本文件。

appId: com.agent.workspace
productName: Agent Workspace
copyright: Copyright © 2026 white

electronDownload:
  mirror: https://registry.npmmirror.com/-/binary/electron/

directories:
  output: out
  buildResources: build

# 只把 Electron 编译产物装入 app.asar。
# package.json 与生产依赖由 electron-builder 自动包含。
files:
  - ".electron/**/*"
  - "!.next${/*}"
  - "!.next-electron${/*}"
  - "!out${/*}"
  - "!dist/**/*"
  - "!out-server${/*}"
  - "!app${/*}"
  - "!electron${/*}"
  - "!scripts${/*}"
  - "!build${/*}"
  - "!public${/*}"
  - "!**/*.map"
  - "!**/test${/*}"
  - "!**/tests${/*}"
  - "!**/__tests__${/*}"
  - "!node_modules/.cache/**/*"

# Next.js standalone 服务放在 resources/standalone，不进入 app.asar。
extraResources:
  - from: out-server/standalone
    to: standalone
    filter:
      - "**/*"
      - ".env.local"
      - "**/.env.local"
      - "!**/.pnpm/**"
      - "!**/node_modules/.pnpm/**"

asar: true
compression: maximum

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: public/icon.ico
  artifactName: "${productName} Setup ${version}.${ext}"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "Agent Workspace"
  uninstallDisplayName: "Agent Workspace"

  installerIcon: public/icon.ico
  uninstallerIcon: public/icon.ico
  installerHeader: build/installerHeader.bmp
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/uninstallerSidebar.bmp

  deleteAppDataOnUninstall: false
  displayLanguageSelector: false
  installerLanguages:
    - zh_CN
  language: 2052
  runAfterFinish: true
  include: build/installer.nsh

mac:
  target:
    - dmg
  icon: public/icon.png

linux:
  target:
    - deb
    - AppImage
  icon: public/icon.png
  category: Utility
