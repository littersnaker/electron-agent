# Multi-agent Electron production packaging configuration.
# appId is intentionally retained for upgrade and local user-data compatibility.
appId: com.agent.workspace
productName: Multi-agent
copyright: Copyright © 2026 Multi-agent Team

electronDownload:
  mirror: https://registry.npmmirror.com/-/binary/electron/

directories:
  output: release
  buildResources: build

# Electron main/preload code is stored in app.asar. The Next.js standalone
# runtime is shipped as an external resource so it can start as a local server.
files:
  - ".electron/**/*"
  - "package.json"
  - "!**/*.map"
  - "!**/test/**/*"
  - "!**/tests/**/*"
  - "!**/__tests__/**/*"
  - "!node_modules/.cache/**/*"

extraResources:
  - from: out-server/standalone
    to: standalone
    filter:
      - "**/*"
      - "!**/.pnpm/**"
      - "!**/node_modules/.pnpm/**"

asar: true
compression: maximum
removePackageScripts: true

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: public/icon.ico
  artifactName: "Multi-agent-${version}-windows-${arch}-setup.${ext}"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "Multi-agent"
  uninstallDisplayName: "Multi-agent"
  installerIcon: public/icon.ico
  uninstallerIcon: public/icon.ico
  installerHeader: build/installerHeader.bmp
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/uninstallerSidebar.bmp
  deleteAppDataOnUninstall: false
  displayLanguageSelector: false
  installerLanguages:
    - zh_CN
  language: 2052
  runAfterFinish: true
  include: build/installer.nsh

mac:
  target:
    - dmg
  icon: public/icon.png
  artifactName: "Multi-agent-${version}-macos-${arch}.${ext}"
  category: public.app-category.productivity

linux:
  target:
    - deb
    - AppImage
  icon: public/icon.png
  artifactName: "Multi-agent-${version}-linux-${arch}.${ext}"
  category: Utility
