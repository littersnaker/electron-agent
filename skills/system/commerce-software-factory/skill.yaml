description: 从电商需求统一生成领域模型、数据库、OpenAPI、Mock 与前端数据源，并要求接入真实页面后验收。
prompt:
  file: prompt.md
tools:
  - workspace.search
  - workspace.read
  - code.inspect
  - workspace.edit
  - workspace.run
  - software_factory.plan
